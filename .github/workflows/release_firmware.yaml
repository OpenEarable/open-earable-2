name: Release OpenEarable v2 Firmware

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        description: 'Tag (e.g. v1.0.0)'
      release_name:
        required: false
        description: 'Name (defaults to tag)'

permissions:
  pull-requests: write
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build_firmware.yaml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Firmware Artifact (FOTA)
        uses: actions/download-artifact@v4
        with:
          name: openearable_v2_fota.zip
          path: ./openearable_v2_fota

      - name: Zip FOTA files again
        run: |
          set -euo pipefail
          # The app expects manifest.json at the ZIP root. Full flashing
          # bundles are build artifacts only and must not enter the release feed.
          test -s openearable_v2_fota/manifest.json
          (cd openearable_v2_fota && zip -r ../openearable_v2_fota.zip .)

      - name: Add version to release asset names
        id: release-assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          # v2.2.8 -> 2.2.8
          version="${RELEASE_TAG#v}"
          fota_name="openearable_v2_fota_${version}.zip"

          mv openearable_v2_fota.zip "$fota_name"

          echo "fota=$fota_name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload FOTA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name || inputs.release_tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ steps.release-assets.outputs.fota }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
