name: Prerelease Open PR Builds

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Build OpenEarable v2 Firmware"
    types:
      - completed

permissions:
  contents: write
  actions: read
  pull-requests: read

env:
  TAG: pr-builds
  BUILD_WORKFLOW_NAME: "Build OpenEarable v2 Firmware"

concurrency:
  group: prerelease-open-pr-builds
  cancel-in-progress: false

jobs:
  prerelease:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Ensure prerelease exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Open PR builds" \
            --notes "Rolling prerelease containing build outputs from all open PRs."
      - name: List open PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "${{ github.repository }}" --state open --json number,headRefOid,title --limit 200 > prs.json
      - name: Download artifacts from each PR's latest successful build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf collected && mkdir -p collected
          jq -c '.[]' prs.json | while read -r pr; do
            num=$(echo "$pr" | jq -r .number)
            sha=$(echo "$pr" | jq -r .headRefOid)
            title=$(echo "$pr" | jq -r .title)
            safe_title=$(echo "$title" | sed 's/[^a-zA-Z0-9_-]/_/g' | cut -c1-50)
            run_id=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "$BUILD_WORKFLOW_NAME" \
              --commit "$sha" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "PR #$num: no successful run found"
              continue
            fi
            out="collected/pr-$num"
            rm -rf "$out" && mkdir -p "$out"
            if ! gh run download "$run_id" --repo "${{ github.repository }}" -n "openearable_v2_firmware.elf" -D "$out/elf" 2>&1; then
              echo "PR #$num: failed to download firmware.elf artifact (may be expired)"
              rm -rf "$out"
              continue
            fi
            if ! gh run download "$run_id" --repo "${{ github.repository }}" -n "openearable_v2_fota.zip" -D "$out/fota" 2>&1; then
              echo "PR #$num: failed to download fota.zip artifact (may be expired)"
              rm -rf "$out"
              continue
            fi
            (cd "$out/fota" && zip -r "../openearable_v2_fota.zip" .)
            mv "$out/elf/openearable_v2_firmware.elf" "$out/openearable_v2_firmware.elf"
            rm -rf "$out/elf" "$out/fota"
            
            echo "$safe_title" > "$out/title.txt"
            
            echo "PR #$num ($title): artifacts downloaded and prepared successfully"
          done
      - name: Upload all PR assets to prerelease (overwrite)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p collected/upload
          release_id=$(gh api \
            "repos/${{ github.repository }}/releases/tags/$TAG" \
            --jq '.id')

          find collected -mindepth 1 -maxdepth 1 -type d -name "pr-*" -print0 | \
            sort -zV | while IFS= read -r -d '' out; do
            pr=$(basename "$out" | sed -n 's/^pr-\([0-9]\+\)$/\1/p')
            [ -n "$pr" ] || continue

            # Asset names include the PR title. Delete every existing asset for
            # this PR before uploading so title or capitalization changes do
            # not collide with GitHub's case-insensitive asset-name check.
            lower_prefix="pr-${pr}-"
            existing_ids=$(gh api --paginate \
              "repos/${{ github.repository }}/releases/$release_id/assets?per_page=100" | \
              jq -r --arg prefix "$lower_prefix" \
                '.[] | select((.name | ascii_downcase) | startswith($prefix)) | .id')
            while IFS= read -r existing_id; do
              [ -n "$existing_id" ] || continue
              gh api --method DELETE \
                "repos/${{ github.repository }}/releases/assets/$existing_id"
            done <<< "$existing_ids"

            title_file="collected/pr-$pr/title.txt"
            if [ -f "$title_file" ]; then
              safe_title=$(cat "$title_file")
            else
              safe_title=""
            fi

            find "$out" -maxdepth 1 -type f \( -name "*.elf" -o -name "*.zip" \) -print0 | \
              sort -z | while IFS= read -r -d '' f; do
              base=$(basename "$f")
              if [ -n "$safe_title" ]; then
                asset="pr-${pr}-${safe_title}-${base}"
              else
                asset="pr-${pr}-${base}"
              fi
              cp "$f" "collected/upload/$asset"
              gh release upload "$TAG" "collected/upload/$asset" \
                --repo "${{ github.repository }}"
            done
          done
          # delete assets of closed PRs
          open_prs="$(jq -r '.[].number' prs.json || true)"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name' | while read -r asset; do
            pr="$(echo "$asset" | sed -n 's/^pr-\([0-9]\+\)-.*$/\1/p')"
            [ -n "$pr" ] || continue
            if ! echo "$open_prs" | grep -qx "$pr"; then
              echo "Deleting asset $asset (PR #$pr is closed/merged)"
              gh release delete-asset "$TAG" "$asset" --repo "${{ github.repository }}" --yes
            fi
          done
