name: Advisory code analysis

on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter advisory report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Analyze the full codebase
        id: full-codebase
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/c_cpp@v9.6.0
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_COMMENT_REPORTER: false
          GITHUB_STATUS_REPORTER: false
          REPORT_OUTPUT_FOLDER: ${{ github.workspace }}/megalinter-reports/full-codebase
          LOG_FILE: megalinter-full-codebase.log
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Analyze files changed in this PR
        id: pr-changes
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/c_cpp@v9.6.0
        env:
          VALIDATE_ALL_CODEBASE: false
          GITHUB_COMMENT_REPORTER: true
          GITHUB_STATUS_REPORTER: false
          MEGALINTER_MULTIRUN_KEY: pr-changes
          REPORTERS_MARKDOWN_SUMMARY_TYPE: sections
          REPORT_OUTPUT_FOLDER: ${{ github.workspace }}/megalinter-reports/pr-changes
          LOG_FILE: megalinter-pr-changes.log
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload detailed reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
          path: |
            megalinter-reports/
            megalinter-full-codebase.log
            megalinter-pr-changes.log
