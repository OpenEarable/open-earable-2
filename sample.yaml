sample:
  name: OpenEarable V2 application
  description: OpenEarable V2 LE Audio application
common:
  integration_platforms:
    - openearable_v2/nrf5340/cpuapp
  platform_allow: openearable_v2/nrf5340/cpuapp
  sysbuild: true
  build_only: true
  tags: ci_build sysbuild
tests:
  applications.openearable_v2.unicast_debug:
    extra_args:
      - EXTRA_CONF_FILE=unicast_server/overlay-unicast_server.conf
  applications.openearable_v2.unicast_release:
    extra_args:
      - FILE_SUFFIX=release
      - EXTRA_CONF_FILE=unicast_server/overlay-unicast_server.conf
  applications.openearable_v2.unicast_fota:
    extra_args:
      - FILE_SUFFIX=fota
      - EXTRA_CONF_FILE=unicast_server/overlay-unicast_server.conf
